name: Windows Build

on:
  workflow_dispatch:
    inputs:
      only_cache:
        description: 'Build libraries only, to warm the cache'
        type: boolean
        default: false
      publish_update:
        description: 'Sign the build, publish a release and point the updater at it'
        type: boolean
        default: false

jobs:

  windows:
    name: Windows x64
    runs-on: windows-latest

    permissions:
      contents: write

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Configure pagefile.
        uses: al-cheb/configure-pagefile-action@v1.4
        with:
          minimum-size: 16GB
          maximum-size: 24GB
          disk-root: "D:"

      - name: Prepare directories.
        run: |
          mkdir %GITHUB_WORKSPACE%\TBuild\Libraries
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v6
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          git config --global user.email "you@example.com"
          git config --global user.name "Build"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v5
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt6-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt6-

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent qt6

      - name: Free up disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' ')' -type f ')' -o -empty ')' -delete

      - name: Telegram Desktop build.
        if: inputs.only_cache != true
        env:
          _CL_: /MP2
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          x64 ^
          qt6 ^
          -D TDESKTOP_API_TEST=ON ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

          cmake --build ..\out --config Release --parallel 2

      - name: Move artifact.
        if: inputs.only_cache != true
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Release
          mkdir artifact
          move %OUT%\AyuGram.exe artifact\
          move %OUT%\Updater.exe artifact\

      - name: Upload artifact.
        if: inputs.only_cache != true
        uses: actions/upload-artifact@v7
        with:
          name: AyuGram-x64
          path: artifact\

      - name: Read version.
        if: inputs.only_cache != true && inputs.publish_update
        shell: bash
        run: |
          set -eu
          version="$TBUILD/$REPO_NAME/Telegram/build/version"
          echo "AppVersion=$(awk '/^AppVersion /{print $2}' "$version")" >> $GITHUB_ENV
          echo "AppVersionStr=$(awk '/^AppVersionStr /{print $2}' "$version")" >> $GITHUB_ENV

      - name: Pack and sign update.
        if: inputs.only_cache != true && inputs.publish_update
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.AYU_UPDATE_PRIVATE_KEY }}
        run: |
          set -eu
          if [ -z "$PRIVATE_KEY" ]; then
            echo "Secret AYU_UPDATE_PRIVATE_KEY is empty"
            exit 1
          fi
          python -m pip install --quiet cryptography
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/update-key.pem"
          python "$TBUILD/$REPO_NAME/tools/ayu-update/pack.py" \
            --version "$AppVersion" \
            --key "$RUNNER_TEMP/update-key.pem" \
            --source "$GITHUB_WORKSPACE/artifact" \
            --out "$GITHUB_WORKSPACE/dist"
          rm -f "$RUNNER_TEMP/update-key.pem"
          python "$TBUILD/$REPO_NAME/tools/ayu-update/verify.py" \
            "$GITHUB_WORKSPACE/dist/tx64upd$AppVersion" \
            --expect-version "$AppVersion"

      - name: Publish release.
        if: inputs.only_cache != true && inputs.publish_update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="v$AppVersionStr"
          asset="$GITHUB_WORKSPACE/dist/tx64upd$AppVersion"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$asset" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$AppVersionStr" \
              --notes "Windows x64 update package for the fork's own updater."
          fi

      - name: Update current4 on Pages.
        if: inputs.only_cache != true && inputs.publish_update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$AppVersionStr/tx64upd$AppVersion"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf "$RUNNER_TEMP/pages"
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" \
            "$RUNNER_TEMP/pages"
          printf '%s:%s\n' "$AppVersion" "$url" > "$RUNNER_TEMP/pages/current4"
          cd "$RUNNER_TEMP/pages"
          git add current4
          if git diff --cached --quiet; then
            echo "current4 already points at this build"
          else
            git commit -m "update to $AppVersionStr"
            git push
          fi
